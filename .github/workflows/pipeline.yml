name: P3DH pipeline

# Runs the whole chain off the laptop: restore state → find new submissions →
# download only those → parse incrementally → Zweig B → Zweig A shards → publish.
#
# The pipeline is STATELESS by design: `raw/` starts empty on every runner. What
# carries over between runs is the state on the orphan `data` branch (long form +
# coverage matrix + parquet), restored by scripts/fetch_state.sh. The coverage
# matrix doubles as the ledger of which submissions were already processed, so a
# run only touches what is genuinely new.

on:
  workflow_dispatch:
    inputs:
      harvest:
        description: "Katalog neu ernten (Playwright/Power-BI) — sonst wird das committete Manifest genutzt"
        type: boolean
        default: false
      full_reparse:
        description: "Alles neu parsen (nach Parser-/Codebook-Änderungen) — lädt den gesamten Korpus neu"
        type: boolean
        default: false
      refresh_codebook:
        description: "DPM-Codebook neu bauen (lädt ~1 GB DPM-Quellen) — nötig, wenn neue Templates unbekannte dp-Codes bringen"
        type: boolean
        default: false
  # Zeitplan bewusst noch nicht scharf: erst soll ein manueller Lauf sauber
  # durchlaufen. Zum Aktivieren die beiden Zeilen einkommentieren.
  # schedule:
  #   - cron: "0 4 * * 1"   # montags 04:00 UTC

permissions:
  contents: write           # push the data branch + refreshed manifests

concurrency:
  group: p3dh-pipeline      # the data branch is force-pushed — never run two at once
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore pipeline state (data branch)
        run: bash scripts/fetch_state.sh

      - name: Record baseline
        id: baseline
        run: |
          before=$(( $(wc -l < processed/long_form_raw.csv) - 1 ))
          echo "records=$before" >> "$GITHUB_OUTPUT"
          echo "Bestand vorher: $before Records"

      # Optional: refresh the catalog. Kept opt-in because it drives a headless
      # Power BI embed — the fragile part of the chain. Without it the run uses
      # the manifests committed on main.
      - name: Harvest catalog
        if: inputs.harvest
        run: |
          playwright install --with-deps chromium
          python scripts/harvest_catalog_query.py
          python scripts/resolve_latest_submissions.py
          python scripts/build_parse_manifest.py
          # Institutsmetadaten fallen aus derselben Query — nur hier verfügbar.
          python scripts/build_entity_meta.py

      # Der Konsument des Diffs (#6). Bis hierher war er reine Ausgabe in einem
      # Runner-Log: berechnet, gedruckt, verworfen.
      - name: Harvest-Delta
        if: inputs.harvest
        run: python scripts/harvest_delta.py >> "$GITHUB_STEP_SUMMARY"

      - name: Plan delta
        run: python scripts/plan_delta.py

      # EINE Entscheidung, drei Konsumenten: Download, Parse, Sanity-Gate.
      #
      # Vorher fragte der Download `inputs.full_reparse`, der Parse zusätzlich
      # `inputs.refresh_codebook`, und der Fingerabdruck aus #57 sprach nur mit
      # dem Parser. Jede Kombination, in der die drei auseinanderliefen, lud das
      # Delta und parste den Bestand voll neu — aus einem `raw/`, das nur die
      # neuen ZIPs enthält (die Pipeline ist stateless, `raw/` beginnt leer).
      # Das traf zwei Fälle: ein per Commit geändertes Codebook ohne Input, und
      # `refresh_codebook` ohne `full_reparse`. Der zweite hätte sogar publiziert,
      # weil das Sanity-Gate ausgerechnet bei diesem Input übersprungen wurde.
      #
      # Muss VOR dem Download stehen und NACH dem State-Restore: der
      # Fingerabdruck kommt mit dem Bestand vom data-Branch.
      - name: Reparse-Modus bestimmen
        id: mode
        run: |
          forced=""
          if [ "${{ inputs.full_reparse }}" = "true" ] || [ "${{ inputs.refresh_codebook }}" = "true" ]; then
            forced="--forced"
          fi
          mode=$(python scripts/xbrl_csv_parser.py --decide $forced)
          echo "Reparse-Modus: $mode"
          if [ "$mode" = "full" ]; then
            echo "full=true" >> "$GITHUB_OUTPUT"
          else
            echo "full=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download new submissions
        run: |
          if [ "${{ steps.mode.outputs.full }}" = "true" ]; then
            python scripts/download_raw_reports.py interim/edap_recon/manifest_parse.csv
          else
            python scripts/download_raw_reports.py interim/edap_recon/manifest_todo.csv
          fi

      # Opt-in: nur nötig, wenn neue Templates dp-Codes mitbringen, die das
      # Codebook nicht kennt. MUSS vor dem Parse laufen — der Parser leitet
      # cell_row/cell_col aus dem Codebook ab; ein Rebuild danach käme zu spät.
      - name: Refresh DPM codebook
        if: inputs.refresh_codebook
        run: |
          python scripts/fetch_dpm_sources.py
          python scripts/extract_template_titles.py
          python scripts/build_codebook.py

      # Ein frisches Codebook wirkt nur auf neu geparste Fakten — der Altbestand
      # trägt die Koordinaten des alten Codebooks. Deshalb erzwingt ein
      # geändertes Codebook den vollen Reparse, entschieden oben in einem Schritt.
      #
      # Der Parser prüft den Fingerabdruck trotzdem noch einmal selbst (#57):
      # die Zusage gehört in den Ausführungspfad, nicht allein in den Workflow.
      # Beide Wege kommen zur selben Antwort — der Schritt oben sorgt nur dafür,
      # dass der Download sie rechtzeitig kennt.
      - name: Parse
        run: |
          if [ "${{ steps.mode.outputs.full }}" = "true" ]; then
            python scripts/xbrl_csv_parser.py --full
          else
            python scripts/xbrl_csv_parser.py
          fi

      # Guards the failure mode that matters: a bug in the incremental merge
      # silently dropping the accumulated corpus. Shrinking is only ever legitimate
      # via a deliberate full re-parse.
      #
      # Der Schritt läuft in JEDEM Modus und meldet die Zahlen; hart bricht er
      # nur inkrementell ab. Vorher hing die Bedingung an den Inputs — seit der
      # Fingerabdruck den vollen Reparse von sich aus auslösen kann, wären damit
      # Läufe ganz ohne Zahlenvergleich durchgelaufen, ohne dass sie jemand
      # angefordert hat. Ein Schrumpfen ist beim Voll-Reparse legitim, aber es
      # unerwähnt zu lassen wäre genau das Schweigen, um das es hier die ganze
      # Zeit geht.
      - name: Sanity gate
        run: |
          after=$(( $(wc -l < processed/long_form_raw.csv) - 1 ))
          before=${{ steps.baseline.outputs.records }}
          echo "vorher: $before · nachher: $after"
          if [ "$after" -ge "$before" ]; then exit 0; fi
          if [ "${{ steps.mode.outputs.full }}" = "true" ]; then
            echo "::warning::Bestand geschrumpft ($before → $after) beim vollen Reparse. \
          Legitim, wenn Einreichungen zurückgezogen wurden — sonst hat der Download \
          nicht den ganzen Korpus geholt."
            echo "- ⚠ Bestand geschrumpft: $before → $after (voller Reparse)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Bestand geschrumpft ($before → $after) — Merge-Fehler, Publish abgebrochen."
            exit 1
          fi

      # Guards the other silent failure: cell_row/cell_col entstehen erst durch
      # einen dp-Lookup gegen dpm_codebook.csv. Kennt das Codebook einen dp nicht,
      # bleiben die Koordinaten leer und der Fakt wird in den Shards weggefiltert —
      # ohne Fehler. Der Guard bricht ab, sobald dieser Verlust wächst.
      - name: Placement guard
        run: python scripts/check_fact_placement.py

      # Referenzdaten VOR Zweig B: der Parquet-Bau joint sie per LEFT JOIN an,
      # eine Lücke gäbe sonst still NULL statt eines Fehlers.
      - name: Refresh FX rates
        run: python scripts/fetch_fx_rates.py

      - name: Build Zweig B (parquet)
        run: python scripts/build_zweig_b.py

      # Konsumentenseitige Gegenprobe: decken Kurse und Institutsmetadaten die
      # geladenen Fakten wirklich ab? Bricht ab, bevor Unvollständiges publiziert wird.
      - name: Reference data guard
        run: python scripts/check_reference_data.py

      # Die Brücke wird aus dem frischen Parquet abgeleitet; ohne diesen Schritt
      # veraltet codebook/framework_bridge.csv still, sobald neue 4.2-Wellen kommen.
      - name: Rebuild framework bridge
        run: python scripts/build_framework_bridge.py

      # Plausibilitaet gegen die Population (#17). Kein Guard, sondern ein
      # Produkt: bricht bewusst NICHT ab, wenn Institute auffaellige Werte
      # melden — das sind Befunde ueber die Einreichungen, keine Fehler in
      # unserer Pipeline. Muss nach Zweig B laufen (braucht fact_value_eur).
      - name: Plausibility profile
        run: python scripts/check_plausibility.py

      # Footprint-Kennzahlen aus dem Länder-Exposure (#12). Wie die
      # Plausibilität eine reine Auswertung des Parquets — ohne Abbruch, die
      # Befunde betreffen die Einreichungen, nicht unsere Pipeline.
      - name: Footprint metrics
        run: python scripts/build_footprint.py

      # Die beiden Auswertungen, die ohne Netz auskommen. Sie liegen als CSV im
      # Repo und wuerden sonst mit jeder neuen Welle veralten, ohne dass es
      # jemandem auffaellt — eine committete Tabelle sieht nicht alt aus.
      #
      # NICHT hier: coverage_gap und eba_reconciliation. Die holen ihre
      # Bezugsgroessen von der EZB bzw. der EBA und gehoeren damit zu einem
      # eigenen, selteneren Lauf.
      - name: Rechtzeitigkeit und RWA-Dichte
        run: |
          python scripts/build_disclosure_lag.py
          python scripts/build_rwa_density.py

      - name: Build Zweig A (JSON shards)
        run: python scripts/build_zweig_a_shards.py

      # Gegenprobe VOR dem Publish: tragen die Shards dieselben Werte wie die
      # Long-Form? Zweig A entsteht über das Parquet, also über zwei
      # Transformationen — und der README verspricht, dass dabei nichts driftet.
      # Geprüft hat das bis 2026-09 niemand: der einzige Mechanismus war der
      # CSV-Viewer, der bei 413 MB nicht mehr lädt und deshalb zurückgezogen
      # wurde. Bricht ab, bevor abweichende Zahlen veröffentlicht werden.
      - name: Zweig-A-Parität
        run: python scripts/check_branch_parity.py

      # Herkunftsnachweis neben dem Parquet (#20). Muss nach allen Guards laufen
      # und vor dem Publish: der data-Branch traegt keine Historie, ohne Manifest
      # ist ein heruntergeladener Bestand nicht identifizierbar. Alle Zahlen
      # werden aus dem Parquet gezaehlt, nicht gepflegt.
      - name: Datensatz-Manifest
        run: python scripts/build_dataset_manifest.py

      - name: Publish data branch
        env:
          P3DH_PUSH_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: bash scripts/publish_data_branch.sh

      # Only the manifests live on main; everything else is derived and belongs
      # on the data branch.
      - name: Commit refreshed manifests
        run: |
          git config user.name  "P3DH pipeline bot"
          git config user.email "noreply@anthropic.com"
          # Explizite Liste statt Glob: interim/edap_recon/*.csv würde auch
          # manifest_todo.csv erfassen (gitignored, bei jedem Lauf neu erzeugt
          # via plan_delta.py) — `git add` bricht dann mit Exit 1 ab, weil eine
          # explizit ignorierte Datei gematcht wurde, und reißt unter bash -e
          # den ganzen Schritt mit (so am 2026-08-27 passiert).
          git add interim/edap_recon/manifest_full.csv \
                  interim/edap_recon/manifest_latest.csv \
                  interim/edap_recon/manifest_parse.csv \
                  interim/edap_recon/manifest_sample.csv \
                  interim/edap_recon/manifest_urls.csv \
                  interim/edap_recon/manifest_wave.csv \
                  codebook/framework_bridge.csv \
                  codebook/dpm_codebook.csv codebook/template_titles.csv \
                  processed/entity_meta.csv processed/fx_rates.csv \
                  processed/quality_profile.csv processed/footprint.csv \
                  processed/disclosure_lag.csv processed/rwa_density.csv \
                  interim/plausibility_cells.csv interim/plausibility_findings.csv
          # Harvest-Delta: entsteht nur bei inputs.harvest, deshalb einzeln und
          # bedingt. harvest_log.csv ist append-only — ohne diesen Commit stirbt
          # die Historie mit dem Runner, und der nächste Lauf beginnt wieder bei
          # einer einzigen Zeile (#6).
          for f in interim/edap_recon/harvest_log.csv \
                   interim/edap_recon/manifest_delta.csv; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "Manifeste und Brücke unverändert"
          else
            git commit -m "Katalog/Brücke/Plausibilitätsprofil/Harvest-Log aktualisiert (Pipeline)"
            git push
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "## P3DH pipeline"
            if [ -f processed/long_form_raw.csv ]; then
              echo "- Records: **$(( $(wc -l < processed/long_form_raw.csv) - 1 ))** (vorher ${{ steps.baseline.outputs.records }})"
            fi
            if [ -f processed/zweig_a/data/index.json ]; then
              echo "- Shards: **$(find processed/zweig_a/data/reports -name '*.json' | wc -l)**"
            fi
            echo "- Viewer: https://tobias-run.github.io/P3DH/"
          } >> "$GITHUB_STEP_SUMMARY"
